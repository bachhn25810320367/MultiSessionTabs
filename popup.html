<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MultiSession Tabs</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>MultiSession</h1>
          <p id="site" data-i18n="loading">Loading...</p>
        </div>
        <span id="status"></span>
      </header>

      <section id="unsupported" hidden>
        <p data-i18n="openHttpPageFirst">Open an http or https page first.</p>
      </section>

      <section id="controls" hidden>
        <label for="session-name" data-i18n="newSessionName">New session name</label>
        <div class="row">
          <input id="session-name" type="text" maxlength="40" placeholder="Work, Personal, QA..." data-i18n-placeholder="namePlaceholder">
          <button id="new-tab" title="Open current URL in a new isolated tab" data-i18n="newTab" data-i18n-title="newTabTitle">New tab</button>
        </div>
        <button id="use-here" class="secondary" title="Reload current tab into a new isolated session" data-i18n="useHere" data-i18n-title="useHereTitle">Use here</button>
        <button id="leave" class="danger" title="Return current tab to normal browser session" data-i18n="leaveSession" data-i18n-title="leaveSessionTitle" hidden>Leave session</button>
      </section>

      <section id="sessions" hidden>
        <h2 data-i18n="savedSessions">Saved sessions</h2>
        <label class="reload-option" hidden>
          <input id="reload-on-delete" type="checkbox" checked>
          <span data-i18n="reloadOnDelete">Reload tabs after deleting</span>
        </label>
        <ul id="session-list"></ul>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
