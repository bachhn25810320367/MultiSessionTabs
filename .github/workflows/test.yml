name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chrome for Testing 136
        run: npx @puppeteer/browsers install chrome@136.0.7103.113 --path .browsers

      - name: Static checks
        run: node test/static-check.js

      # smoke.js launches headless Chrome (new headless supports extensions),
      # auto-discovering the binary installed above into .browsers/, so no xvfb needed.
      - name: Smoke test
        run: node test/smoke.js
